name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build release binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Build portable Linux binary
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config libsqlite3-dev binutils
          rustup target add x86_64-unknown-linux-musl
          CC_x86_64_unknown_linux_musl=musl-gcc \
            AR_x86_64_unknown_linux_musl=ar \
            cargo build --release --target x86_64-unknown-linux-musl

      - name: Run tests
        run: cargo test

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/craftcms dist/craftcms
          chmod 755 dist/craftcms
          (cd dist && shasum -a 256 craftcms > craftcms.sha256)

      - name: Remove stale release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          status="$(curl -sS -o /tmp/release.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/releases/tags/${GITHUB_REF_NAME}")"

          if [ "${status}" = "404" ]; then
            exit 0
          fi

          if [ "${status}" != "200" ]; then
            cat /tmp/release.json
            exit 1
          fi

          release_id="$(jq -r '.id' /tmp/release.json)"
          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/releases/${release_id}/assets?per_page=100" \
            | jq -r '.[] | select((.name | test("^craftcms-[^-]+-linux")) or (.name == "craftcms.tar.gz")) | .id' \
            | while read -r asset_id; do
                curl -fsS -X DELETE \
                  -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  "${api}/releases/assets/${asset_id}"
              done

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.4.1
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
