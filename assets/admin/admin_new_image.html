<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Add New Image - {{ site_name }}</title>
        <link rel="stylesheet" href="/admin/assets/css/admin.css" />
    </head>
    <body class="admin-body">
        <div class="admin-shell">
            <aside class="admin-sidebar">
                <div class="admin-brand">
                    <span class="admin-brand-label">CraftCMS</span>
                    <h1>{{ site_name }}</h1>
                    <p>Admin</p>
                </div>

                <nav class="admin-nav">
                    <a href="/admin" class="admin-nav-link">Gallery</a>
                    <a href="/admin/settings" class="admin-nav-link">Settings</a>
                    <a href="/" class="admin-nav-link">View Site</a>
                </nav>

                <button onclick="logout()" class="admin-logout">Logout</button>
            </aside>

            <main class="admin-main">
                <header class="admin-topbar">
                    <div>
                        <p class="eyebrow">Content</p>
                        <h2>Add New Image</h2>
                    </div>
                </header>

                <section class="admin-panel">
            <form
                action="/admin/create"
                method="post"
                enctype="multipart/form-data"
                class="stacked-form"
            >
                <div class="form-group">
                    <label for="image">Image File</label>
                    <input
                        type="file"
                        id="image"
                        name="image"
                        accept="image/*"
                        required
                    />
                    <div class="image-preview"></div>
                </div>

                <div class="section-heading">
                    <div>
                        <p class="eyebrow">Metadata</p>
                        <h3>Image Details</h3>
                    </div>
                </div>

                <div class="form-group">
                    <label for="alt">Title</label>
                    <input
                        type="text"
                        id="alt"
                        name="alt"
                        required
                        placeholder="Title for the image"
                    />
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description"
                        required
                        placeholder="Detailed description of the image"
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="slug">Slug</label>
                    <input
                        type="text"
                        id="slug"
                        name="slug"
                        required
                        placeholder="url-friendly-name"
                    />
                </div>

                <div class="form-group">
                    <label for="keywords">Keywords</label>
                    <input
                        type="text"
                        id="keywords"
                        name="keywords"
                        placeholder="ceramic, pottery, handmade"
                    />
                </div>

                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status">
                        <option value="published">Published</option>
                        <option value="draft">Draft</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="button button-primary">
                        Create Image
                    </button>
                </div>
            </form>
                </section>
            </main>
        </div>

        <script>
            // Image preview functionality
            const imageInput = document.querySelector("#image");
            const imagePreview = document.querySelector(".image-preview");

            imageInput.addEventListener("change", function () {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        imagePreview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                        imagePreview.classList.add("active");
                    };
                    reader.readAsDataURL(file);
                }
            });

            // Simple slug generator from title
            const altInput = document.querySelector("#alt");
            const slugInput = document.querySelector("#slug");

            altInput.addEventListener("input", function () {
                if (!slugInput.value) {
                    // Only update if slug is empty
                    slugInput.value = this.value
                        .toLowerCase()
                        .replace(/[^a-z0-9]+/g, "-")
                        .replace(/(^-|-$)/g, "");
                }
            });
        </script>
        <script src="/admin/assets/js/admin.js"></script>
    </body>
</html>
