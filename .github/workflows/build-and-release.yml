name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build release assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Build Nix package
        run: nix build .#packages.x86_64-linux.craftcms

      - name: Build portable Linux binary
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools pkg-config libsqlite3-dev binutils
          rustup target add x86_64-unknown-linux-musl
          CC_x86_64_unknown_linux_musl=musl-gcc \
            AR_x86_64_unknown_linux_musl=ar \
            cargo build --release --target x86_64-unknown-linux-musl

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/craftcms dist/craftcms
          chmod 755 dist/craftcms
          (cd dist && shasum -a 256 craftcms > craftcms.sha256)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: craftcms
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Configure Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish to FlakeHub
        uses: DeterminateSystems/flakehub-push@v1
        with:
          visibility: public
          name: BearGuy/craftcms
          tag: ${{ github.ref_name }}
          include-output-paths: true

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -maxdepth 2 -type f -exec cp {} release/ \;

      - name: Remove stale labeled release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          release_id="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/releases/tags/${GITHUB_REF_NAME}" \
            | jq -r '.id')"

          curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api}/releases/${release_id}/assets?per_page=100" \
            | jq -r '.[] | select((.name | test("^craftcms-[^-]+-linux")) or (.name == "craftcms.tar.gz")) | .id' \
            | while read -r asset_id; do
                curl -fsS -X DELETE \
                  -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  "${api}/releases/assets/${asset_id}"
              done

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
